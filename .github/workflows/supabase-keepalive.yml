name: Supabase Keep-Alive

# 每天對資料庫做一次真實查詢，避免免費方案連續 7 天無活動而暫停。
on:
  schedule:
    - cron: '17 2 * * *'   # 每天 UTC 02:17（台灣時間 10:17）執行一次
  workflow_dispatch: {}     # 也可在 Actions 頁面手動觸發測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST（會實際查到資料庫）
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://krfrlpmgpfdntaqlyjyq.supabase.co/rest/v1/bagels?select=id&limit=1" \
            -H "apikey: sb_publishable_Pg8T2D8pc-kkKIDD7hF6UA_5qRDGGsS"
